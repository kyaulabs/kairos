[project]
name = "kairos-trader"
version = "0.15.3"
description = "Experimental trading for Kraken and Alpaca hosted paper with a live dashboard"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.12,<4", "python-dotenv>=1.1,<2"]

[project.optional-dependencies]
codex-research = ["openai-codex==0.162.1"]

[project.scripts]
kairos = "kairos.web:main"
kairos-worker = "kairos.web:worker_main"
kairos-smoke = "kairos.smoke:main"
kairos-backtest = "kairos.backtest:main"
kairos-research = "kairos.research_backtest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kairos"]

[dependency-groups]
dev = ["ruff>=0.12,<1"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
