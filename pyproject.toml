[project]
name = "kairos-trader"
version = "0.1.0"
description = "Jev-assisted Kraken spot trading with paper execution and a live dashboard"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.12,<4", "python-dotenv>=1.1,<2"]

[project.scripts]
kairos = "kairos.web:main"
kairos-smoke = "kairos.smoke:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kairos"]

[dependency-groups]
dev = ["ruff>=0.12,<1"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
