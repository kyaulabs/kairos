name: Release

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      release_pr:
        description: "Already-merged release PR number (safe retry only)"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  actions: read

# Never interrupt tag/publication/back-merge midway for a newer release.
concurrency:
  group: kairos-release
  cancel-in-progress: false

env:
  RELEASE_PR: ${{ inputs.release_pr || github.event.pull_request.number }}

jobs:
  validate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Validate merged release and provenance
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release.py validate
      - name: Require dedicated automation credentials
        env:
          BOT_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
          REVIEW_TOKEN: ${{ secrets.RELEASE_REVIEW_TOKEN }}
        run: |
          test -n "$BOT_TOKEN" || { echo 'Configure RELEASE_BOT_TOKEN before publishing.'; exit 1; }
          test -n "$REVIEW_TOKEN" || { echo 'Configure RELEASE_REVIEW_TOKEN before publishing.'; exit 1; }

  verify:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.validate.outputs.sha }}

  publish:
    needs: [validate, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      backmerge: ${{ steps.release.outputs.backmerge }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Tag, publish and open back-merge PR as kyaulabs-bot
        id: release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
        run: python3 .github/scripts/release.py publish

  approve:
    needs: [validate, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Wait for back-merge CI, complete Test Plan and approve as kyau
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REVIEW_TOKEN }}
          BACKMERGE_PR: ${{ needs.publish.outputs.backmerge }}
        run: python3 .github/scripts/release.py approve

  backmerge:
    needs: [validate, publish, approve]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Merge approved back-merge PR and remove its temporary branch
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
          BACKMERGE_PR: ${{ needs.publish.outputs.backmerge }}
        run: python3 .github/scripts/release.py merge
