name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact release merge commit to verify
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ALLOW_LIVE_TRADING: "false"
  ALLOW_ALPACA_PAPER_TRADING: "false"
  ALPACA_PAPER_API_KEY: ""
  ALPACA_PAPER_SECRET_KEY: ""
  KAIROS_EXCHANGE: "kraken"
  KRAKEN_API_KEY: ""
  KRAKEN_PRIVATE_KEY: ""
  KRAKEN_FUTURES_API_KEY: ""
  KRAKEN_FUTURES_PRIVATE_KEY: ""
  JEV_API_KEY: ""

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release PR provenance and version
        if: github.event_name == 'pull_request'
        run: python3 .github/scripts/release.py check-pr
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.3"
          python-version: "3.14"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Check Python lint
        run: uv run --no-sync ruff check kairos tests .github/scripts
      - name: Check Python formatting
        run: uv run --no-sync ruff format --check --output-format concise kairos tests .github/scripts
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Validate GitHub workflows
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/*.yml
      - name: Check JavaScript syntax
        run: |
          node --check kairos/static/app.js
          node --check kairos/static/assessment.js
          node --check kairos/static/settings.js
          node --check kairos/static/settings-help.js
          node --check kairos/static/sidebar.js
          node --check kairos/static/chart.js
          node --check kairos/static/polling.js
          node --check kairos/static/markets.js
          node --check kairos/static/strategy-market.js
          node --check kairos/static/accounts.js
          node --check kairos/static/appearance.js
      - name: Test dashboard components
        run: node --test tests/*.test.cjs

  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.3"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Run regression tests
        run: uv run --no-sync python -m unittest discover -v
